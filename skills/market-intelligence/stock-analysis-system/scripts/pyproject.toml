[project]
name = "stock"
version = "0.1.0"
description = "基于技术指标的股票分析API服务"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.17.38",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pandas-stubs==2.3.0.250703",
    "yfinance>=0.2.36",
    # "tushare>=1.2.89",  # Tushare功能已禁用
    "ta-lib>=0.4.28",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
